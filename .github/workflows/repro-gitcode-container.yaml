name: repro-gitcode-container

# 临时：容器层（CANN 镜像）复查 gitcode 重写与 git-cdn-gitcode DNS，用完删。

on:
  workflow_dispatch:
    inputs:
      runner:
        default: '["linux-amd64-cpu-2-hk001"]'

jobs:
  probe:
    runs-on: ${{ fromJSON(inputs.runner) }}
    container:
      image: swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
    timeout-minutes: 8
    steps:
      - name: 容器层重写与 DNS
        run: |
          echo '--- gitconfig url 重写 ---'
          git config --list --show-origin | grep -i 'insteadof' || echo '(无 insteadOf)'
          echo '--- 展开后的 catlass URL ---'
          git ls-remote --get-url https://gitcode.com/cann/catlass.git || true
          echo '--- DNS ---'
          for h in git-cdn-service.git-cdn-gitcode.svc.cluster.local git-cdn-service.git-cdn.svc.cluster.local; do
            getent hosts "$h" && echo "OK: $h" || echo "DNS-FAIL: $h"
          done
          echo '--- 实际拉取 ---'
          timeout 25 git ls-remote https://gitcode.com/cann/catlass.git HEAD || echo GIT-FAIL
