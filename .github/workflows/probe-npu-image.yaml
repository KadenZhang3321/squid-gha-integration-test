name: probe-npu-image

# 临时探针：只取事实，不做断言。
# 目的：在带 NPU 注入的 runner 上，对比不同基底镜像里 npu-smi 的可见性与可执行性。
on:
  workflow_dispatch:

jobs:
  probe:
    name: probe ${{ matrix.image }}
    runs-on: ["linux-amd64-cpu-2", "gy-006"]
    strategy:
      fail-fast: false
      matrix:
        image:
          - swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
          - swr.cn-north-12.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-openeuler24.03-py3.12
          - swr.cn-north-12.myhuaweicloud.com/modelfoundry/openeuler/openeuler:24.03
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: npu-smi 可见性取证
        shell: bash
        run: |
          echo "=== image: ${{ matrix.image }}"
          echo "--- PATH=$PATH"
          echo "--- command -v npu-smi"; command -v npu-smi || echo "NOT-IN-PATH"
          echo "--- /usr/local/sbin/npu-smi"; ls -l /usr/local/sbin/npu-smi 2>&1 || true
          echo "--- /usr/local/Ascend"; ls /usr/local/Ascend 2>&1 || true
          echo "--- /usr/local/Ascend/driver"; ls /usr/local/Ascend/driver 2>&1 || true
          echo "--- /usr/local/Ascend/driver/tools (injected by device-plugin?)"; ls /usr/local/Ascend/driver/tools 2>&1 | head -30 || true
          echo "--- /dev/davinci*"; ls -l /dev/davinci* 2>&1 || true
          echo "--- find npu-smi under common roots"
          for r in /usr/bin /usr/local/bin /usr/local/sbin /usr/local/Ascend; do
            find "$r" -maxdepth 4 -name 'npu-smi*' 2>/dev/null || true
          done
          echo "--- run npu-smi info"
          if command -v npu-smi >/dev/null 2>&1; then
            npu-smi info 2>&1 | head -20 || echo "run-failed(code=$?)"
          else
            /usr/local/Ascend/driver/tools/npu-smi info 2>&1 | head -20 || echo "driver-tools-run-failed"
          fi
          echo "--- /bin/sh -> ?"; ls -l /bin/sh
          echo "--- lsb release"; cat /etc/os-release 2>/dev/null | head -3
